<!doctype html>
<html lang="en" class="auto"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stream+</title><meta name="description" content="Track every streaming service you pay for and what it costs each month.">
<meta name="theme-color" content="#0e1117"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Stream+">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0e1117;--panel:#161b24;--panel2:#1d2430;--line:#2a3342;--text:#e8edf5;--dim:#98a3b5;--accent:#8b5cf6;--accent2:#ec4899;--good:#3ecf8e;--bad:#ff6b6b;--warn:#ffc857;--r:16px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root.auto{--bg:#f4f6fa;--panel:#fff;--panel2:#eef1f6;--line:#d9dfe9;--text:#161b24;--dim:#5b6678}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:var(--safe-t) 0 var(--safe-b);-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;line-height:1.2}h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}
a{color:var(--accent)}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 90px}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 14px}.top .logo{width:38px;height:38px;border-radius:10px}.top .grow{flex:1}.sub{color:var(--dim);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>label.f{min-width:130px}.grow{flex:1}.col{display:flex;flex-direction:column;gap:8px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer}.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.small{padding:6px 11px;font-size:14px;border-radius:10px}.btn.danger{background:var(--bad)}.btn:active{transform:scale(.97)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}input[type=range]{padding:0;accent-color:var(--accent)}input[type=checkbox]{width:auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--dim);margin:0 6px 6px 0;cursor:pointer}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;overflow-x:auto}.tabs button{flex:1;min-width:max-content;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.big{font-size:38px;font-weight:800;letter-spacing:-.02em}.muted{color:var(--dim)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.on{display:flex}.sheet{background:var(--panel);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:16px 16px calc(20px + var(--safe-b))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}.toast.on{opacity:1}
table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}th{color:var(--dim);font-weight:600}
.bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px}
.foot{color:var(--dim);font-size:12px;text-align:center;padding:20px 0}
</style></head><body>

<div class="wrap">
 <div class="top"><img class="logo" src="icon-192.png" alt=""><div class="grow"><h1>Stream+</h1><div class="sub">Every streaming service you pay for, and what it costs</div></div><button class="btn small ghost" id="btnData">Data</button></div>
 <div class="card" id="summary"></div>
 <div class="row" style="margin-bottom:10px"><h2 class="grow">Your services</h2><select id="sort" style="width:auto"><option value="cost">Highest cost</option><option value="name">Name</option><option value="renew">Next charge</option></select><button class="btn" id="btnAdd">+ Add service</button></div>
 <div id="list"></div>
 <div class="card" id="renewals"></div>
 <div class="card" id="insights"></div>
 <div class="card" id="cats"></div>
 <div class="foot">Prices are US list prices checked in October 2026 and change often: tap any service to edit its price. Your data stays on this device.</div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="modal" id="dataModal"><div class="sheet">
 <h2>Your data</h2><p class="sub">Stream+ stores everything on this device only.</p>
 <div class="row"><button class="btn ghost" id="btnExport">Export JSON</button><button class="btn ghost" id="btnCsv">Export CSV</button><label class="btn ghost" style="cursor:pointer">Import JSON<input type="file" id="fileImport" accept="application/json" hidden></label></div>
 <hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><label class="f">Monthly budget goal<input id="budget" type="number" min="0" step="1" placeholder="e.g. 60"></label>
 <div class="row" style="margin-top:12px"><button class="btn danger" id="btnReset">Delete everything</button><span class="grow"></span><button class="btn" id="btnCloseData">Done</button></div>
</div></div>

<div class="toast" id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script>

const CATALOG=[
 {id:'netflix',name:'Netflix',color:'#e50914',cat:'Video',plans:[['Standard with ads',8.99],['Standard',19.99],['Premium (4K)',26.99]]},
 {id:'disney',name:'Disney+',color:'#1a3fd1',cat:'Video',plans:[['With ads',12.49],['Premium',21.49]]},
 {id:'hulu',name:'Hulu',color:'#1ce783',cat:'Video',plans:[['With ads',12.49],['No ads',21.49],['Live TV with ads',99.99],['Live TV no ads',109.99]]},
 {id:'disneyhulu',name:'Disney+ & Hulu bundle',color:'#3b6bff',cat:'Video',plans:[['With ads',12.99],['Premium (no ads)',21.99]]},
 {id:'hbomax',name:'HBO Max',color:'#7a3cf0',cat:'Video',plans:[['Basic with ads',10.99],['Standard',18.49],['Premium (4K)',22.99]]},
 {id:'prime',name:'Prime Video',color:'#00a8e1',cat:'Video',plans:[['Prime Video with ads',8.99],['Prime Video ad-free',13.98],['Amazon Prime (includes Video)',14.99]]},
 {id:'peacock',name:'Peacock',color:'#f5c518',cat:'Video',plans:[['Select',8.99],['Premium',12.99],['Premium Plus',19.99]]},
 {id:'paramount',name:'Paramount+',color:'#0064ff',cat:'Video',plans:[['Essential',8.99],['Premium',13.99]]},
 {id:'appletv',name:'Apple TV',color:'#a0a7b3',cat:'Video',plans:[['Apple TV',14.99]]},
 {id:'youtube',name:'YouTube Premium',color:'#ff0033',cat:'Video',plans:[['Premium Lite',8.99],['Individual',15.99],['Family',26.99]]},
 {id:'youtubetv',name:'YouTube TV',color:'#ff4d4d',cat:'Live TV',plans:[['Base plan',82.99]]},
 {id:'espn',name:'ESPN Unlimited',color:'#e5262d',cat:'Sports',plans:[['Unlimited',31.99]]},
 {id:'spotify',name:'Spotify',color:'#1db954',cat:'Music',approx:true,plans:[['Premium Individual',12.99]]},
 {id:'applemusic',name:'Apple Music',color:'#fa243c',cat:'Music',approx:true,plans:[['Individual',10.99]]},
];
const CATS=['Video','Live TV','Sports','Music','Other'];
const KEY='streamplus.v1';
let S=store.get(KEY,{subs:[],budget:0});
const money=n=>'$'+(Math.round(n*100)/100).toFixed(2);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const monthly=s=>s.paused?0:(s.cycle==='yearly'?s.price/12:s.price)/Math.max(1,s.split||1);
function nextCharge(s){ if(!s.next) return null; let d=parse(s.next); const t=today(), guard=0; let i=0;
  while(d<t && i++<600){ if(s.cycle==='yearly') d=new Date(d.getFullYear()+1,d.getMonth(),d.getDate()); else {const dd=d.getDate(); d=new Date(d.getFullYear(),d.getMonth()+1,1); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(dd,last));} }
  return d; }
const daysUntil=d=>Math.round((d-today())/86400000);
const svc=id=>CATALOG.find(c=>c.id===id);
const save=()=>{store.set(KEY,S);render()};
const total=()=>S.subs.reduce((a,s)=>a+monthly(s),0);

function render(){
  const tot=total(), n=S.subs.filter(s=>!s.paused).length, paused=S.subs.length-n;
  const budget=+S.budget||0;
  $('#summary').innerHTML=`<div class="row"><div class="grow"><div class="sub">You spend each month</div><div class="big" id="bigTotal">${money(tot)}</div><div class="sub">${money(tot*12)} a year · ${money(tot/30.4)} a day · ${n} active service${n===1?'':'s'}${paused?` · ${paused} paused`:''}</div></div></div>`
   +(budget?`<div style="margin-top:12px"><div class="row"><span class="sub grow">Budget goal ${money(budget)} a month</span><span class="${tot>budget?'bad':'good'}">${tot>budget?money(tot-budget)+' over':money(budget-tot)+' left'}</span></div><div class="bar"><i style="width:${Math.min(100,tot/budget*100)}%;${tot>budget?'background:var(--bad)':''}"></i></div></div>`:'');
  const sort=$('#sort').value, subs=[...S.subs];
  subs.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='renew'?((nextCharge(a)||new Date(9e12))-(nextCharge(b)||new Date(9e12))):monthly(b)-monthly(a));
  $('#list').innerHTML=subs.length?subs.map(s=>{const c=svc(s.svc),nc=nextCharge(s),du=nc?daysUntil(nc):null;
    return `<div class="card sub-card" data-id="${s.id}" style="cursor:pointer;opacity:${s.paused?.55:1}"><div class="row"><div style="width:12px;height:44px;border-radius:6px;background:${c?c.color:'#7a8699'}"></div><div class="grow"><h3>${esc(s.name)}${s.paused?' <span class="chip">paused</span>':''}</h3><div class="sub">${esc(s.plan||'')} · ${money(s.price)}/${s.cycle==='yearly'?'year':'month'}${s.split>1?` · split ${s.split} ways`:''}${nc?` · next charge ${nc.toLocaleDateString(undefined,{month:'short',day:'numeric'})}${du<=7?` (${du===0?'today':'in '+du+' d'})`:''}`:''}</div></div><div style="text-align:right"><div style="font-weight:700;font-size:18px">${money(monthly(s))}</div><div class="sub">per month</div></div></div>${tot>0&&!s.paused?`<div class="bar" style="margin-top:10px"><i style="width:${monthly(s)/tot*100}%"></i></div>`:''}</div>`}).join('')
   :`<div class="card"><h3>Add your first service</h3><p class="sub">Tap one to add it with today's price, or use + Add service for anything else.</p><div class="row">${CATALOG.map(c=>`<span class="chip quick" data-svc="${c.id}">${esc(c.name)}</span>`).join('')}</div></div>`;
  // renewals
  const up=S.subs.filter(s=>!s.paused&&s.next).map(s=>({s,d:nextCharge(s)})).filter(x=>daysUntil(x.d)<=30).sort((a,b)=>a.d-b.d);
  $('#renewals').innerHTML=`<h2>Coming up in the next 30 days</h2>`+(up.length?`<table>${up.map(x=>`<tr><td>${x.d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</td><td>${esc(x.s.name)}</td><td style="text-align:right">${money(x.s.cycle==='yearly'?x.s.price/Math.max(1,x.s.split||1):x.s.price/Math.max(1,x.s.split||1))}</td></tr>`).join('')}</table><p class="sub">Charges due: ${money(up.reduce((a,x)=>a+x.s.price/Math.max(1,x.s.split||1),0))}</p>`:`<p class="sub">Nothing scheduled. Add a next-charge date to a service to see it here.</p>`);
  // insights
  const tips=insights(); $('#insights').innerHTML=`<h2>Ways to save</h2>`+(tips.length?tips.map(t=>`<p>${t}</p>`).join(''):`<p class="sub">Nothing to flag. Cancel and rotate services when a show you love ends: most services let you resubscribe any time.</p>`);
  // categories
  const by={};S.subs.forEach(s=>{by[s.cat||'Other']=(by[s.cat||'Other']||0)+monthly(s)});
  const ent=Object.entries(by).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
  $('#cats').innerHTML=`<h2>By category</h2>`+(ent.length?ent.map(([k,v])=>`<div class="row" style="margin:8px 0"><span style="width:80px">${esc(k)}</span><div class="grow bar"><i style="width:${v/tot*100}%"></i></div><span style="width:74px;text-align:right">${money(v)}</span></div>`).join(''):`<p class="sub">No spending yet.</p>`);
  $$('.sub-card').forEach(el=>el.onclick=()=>edit(el.dataset.id));
  $$('.quick').forEach(el=>el.onclick=()=>edit(null,el.dataset.svc));
  $('#budget').value=budget||'';
}
function insights(){ const out=[], act=S.subs.filter(s=>!s.paused), has=id=>act.find(s=>s.svc===id);
  const d=has('disney'),h=has('hulu');
  if(d&&h&&!has('disneyhulu')){ const ad=/ads/i.test(d.plan)&&!/no ads/i.test(h.plan), sep=monthly(d)+monthly(h), b=svc('disneyhulu').plans[ad?0:1][1]; if(sep>b) out.push(`<b>Bundle Disney+ and Hulu.</b> You pay ${money(sep)} a month for both; the Disney+ &amp; Hulu bundle (${ad?'with ads':'premium'}) is ${money(b)}. That saves about <span class="good">${money((sep-b)*12)} a year</span>.`); }
  if(has('appletv')&&has('peacock')) out.push(`<b>Apple TV + Peacock bundle.</b> The two services offer a joint bundle (reported from about $14.99 to $17.99 a month): compare it with the ${money(monthly(has('appletv'))+monthly(has('peacock')))} you pay separately.`);
  act.forEach(s=>{ const c=svc(s.svc); if(!c||c.plans.length<2) return; const cheaper=c.plans.filter(p=>p[1]<s.price&&/ads/i.test(p[0])&&!/no ads/i.test(p[0])&&!/live/i.test(p[0])&&!/live/i.test(s.plan||'')); if(cheaper.length&&!/ads/i.test(s.plan||'')){ const p=cheaper[0]; out.push(`<b>${esc(s.name)}:</b> the ad-supported plan (${esc(p[0])}) is ${money(p[1])} a month, saving <span class="good">${money((s.price-p[1])*12/Math.max(1,s.split||1))} a year</span> if you can live with ads.`); } });
  const biggest=[...act].sort((a,b)=>monthly(b)-monthly(a))[0]; if(biggest&&act.length>1&&monthly(biggest)>total()*0.4) out.push(`<b>${esc(biggest.name)}</b> is ${Math.round(monthly(biggest)/total()*100)}% of your streaming spend. Pausing it for two months a year would save about <span class="good">${money(monthly(biggest)*2)}</span>.`);
  const yt=has('youtubetv'); if(yt) out.push(`<b>YouTube TV</b> is ${money(monthly(yt))} a month, more than all the on-demand services combined in many households. Check you watch enough live TV to justify it.`);
  if(act.length>=5) out.push(`<b>Rotate.</b> You have ${act.length} active services. Watching one or two at a time and rotating each month typically cuts a streaming bill by a third or more.`);
  const dup=act.filter(s=>svc(s.svc)&&svc(s.svc).cat==='Music'); if(dup.length>1) out.push(`<b>Two music services:</b> ${dup.map(s=>esc(s.name)).join(' and ')}. Keeping one saves about <span class="good">${money(Math.min(...dup.map(monthly))*12)} a year</span>.`);
  return out; }
function edit(id,svcId){
  const s=id?S.subs.find(x=>x.id===id):{id:'s'+Date.now(),svc:svcId||'custom',name:'',plan:'',price:0,cycle:'monthly',split:1,next:iso(new Date(today().getTime()+7*86400000)),cat:'Video',paused:false,notes:''};
  if(!id&&svcId){const c=svc(svcId);s.name=c.name;s.plan=c.plans[0][0];s.price=c.plans[0][1];s.cat=c.cat}
  const c0=svc(s.svc);
  $('#sheet').innerHTML=`<h2>${id?'Edit':'Add'} service</h2>
   <div class="col" style="margin-top:10px">
   <label class="f">Service<select id="fSvc">${CATALOG.map(c=>`<option value="${c.id}" ${s.svc===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}<option value="custom" ${s.svc==='custom'?'selected':''}>Something else (custom)</option></select></label>
   <label class="f" id="fNameW">Name<input id="fName" value="${esc(s.name)}" placeholder="Service name"></label>
   <label class="f">Plan<select id="fPlan"></select></label>
   <div class="row"><label class="f grow">Price (USD)<input id="fPrice" type="number" step="0.01" min="0" value="${s.price}"></label><label class="f grow">Billed<select id="fCycle"><option value="monthly" ${s.cycle==='monthly'?'selected':''}>Monthly</option><option value="yearly" ${s.cycle==='yearly'?'selected':''}>Yearly</option></select></label></div>
   <div class="row"><label class="f grow">Next charge date<input id="fNext" type="date" value="${s.next||''}"></label><label class="f grow">Split between (people)<input id="fSplit" type="number" min="1" max="12" value="${s.split||1}"></label></div>
   <label class="f">Category<select id="fCat">${CATS.map(c=>`<option ${s.cat===c?'selected':''}>${c}</option>`).join('')}</select></label>
   <label class="row" style="gap:8px"><input type="checkbox" id="fPaused" ${s.paused?'checked':''}> Paused (not counted in totals)</label>
   </div><p class="sub" id="fNote"></p>
   <div class="row" style="margin-top:12px">${id?'<button class="btn danger" id="fDel">Delete</button>':''}<span class="grow"></span><button class="btn ghost" id="fCancel">Cancel</button><button class="btn" id="fSave">Save</button></div>`;
  const planSel=$('#fPlan');
  function fillPlans(keep){ const c=svc($('#fSvc').value); planSel.innerHTML=(c?c.plans.map((p,i)=>`<option value="${i}">${esc(p[0])}: ${money(p[1])}</option>`).join(''):'')+'<option value="custom">Custom price</option>';
    let idx=c?c.plans.findIndex(p=>p[0]===s.plan):-1; planSel.value=keep&&idx>=0?String(idx):(c?'0':'custom'); $('#fNote').textContent=c&&c.approx?'This price is approximate: check your own bill.':''; }
  $('#fSvc').onchange=()=>{ const c=svc($('#fSvc').value); if(c){ $('#fName').value=c.name; $('#fCat').value=c.cat; s.plan=''; fillPlans(false); applyPlan(); } else { $('#fName').value=''; planSel.innerHTML='<option value="custom">Custom price</option>'; } };
  function applyPlan(){ const c=svc($('#fSvc').value); if(c&&planSel.value!=='custom'){ $('#fPrice').value=c.plans[+planSel.value][1]; $('#fCycle').value='monthly'; } }
  planSel.onchange=applyPlan; fillPlans(!!id); if(!id&&svcId){} 
  $('#fCancel').onclick=()=>$('#modal').classList.remove('on');
  if(id) $('#fDel').onclick=()=>{ if(confirm('Delete '+s.name+'?')){ S.subs=S.subs.filter(x=>x.id!==id); $('#modal').classList.remove('on'); save(); toast('Deleted'); } };
  $('#fSave').onclick=()=>{ const sv=$('#fSvc').value, c=svc(sv), name=$('#fName').value.trim()||(c?c.name:''); if(!name){toast('Give it a name');return}
    const price=parseFloat($('#fPrice').value); if(!(price>=0)){toast('Enter a price');return}
    const pl=c&&planSel.value!=='custom'?c.plans[+planSel.value][0]:(s.plan||'Custom');
    Object.assign(s,{svc:sv,name,plan:pl,price,cycle:$('#fCycle').value,next:$('#fNext').value,split:Math.max(1,parseInt($('#fSplit').value)||1),cat:$('#fCat').value,paused:$('#fPaused').checked});
    if(!id) S.subs.push(s); $('#modal').classList.remove('on'); save(); toast(id?'Saved':'Added'); };
  $('#modal').classList.add('on'); }
$('#btnAdd').onclick=()=>edit(null,null); $('#sort').onchange=render;
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')};
$('#dataModal').onclick=e=>{if(e.target.id==='dataModal')$('#dataModal').classList.remove('on')};
$('#btnData').onclick=()=>$('#dataModal').classList.add('on'); $('#btnCloseData').onclick=()=>$('#dataModal').classList.remove('on');
$('#budget').onchange=e=>{S.budget=Math.max(0,parseFloat(e.target.value)||0);save()};
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
$('#btnExport').onclick=()=>download('streamplus.json',JSON.stringify(S,null,1),'application/json');
$('#btnCsv').onclick=()=>download('streamplus.csv','Service,Plan,Price,Billing,Split,Per month,Next charge,Category,Paused\n'+S.subs.map(s=>[s.name,s.plan,s.price,s.cycle,s.split||1,monthly(s).toFixed(2),s.next||'',s.cat,s.paused?'yes':''].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');
$('#fileImport').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.subs))throw 0;S={subs:d.subs,budget:+d.budget||0};save();toast('Imported '+S.subs.length+' services')}catch(x){toast('That file is not a Stream+ export')}})};
$('#btnReset').onclick=()=>{if(confirm('Delete all your Stream+ data?')){S={subs:[],budget:0};save();$('#dataModal').classList.remove('on')}};
window.__streamplus={get S(){return S},total,monthly,insights,CATALOG};
render();

</script></body></html>
